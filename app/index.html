<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 90vh; margin: 0; background: #fff; color: #1A1A1A; text-align: center; padding: 24px; }
  .logo { font-size: 40px; font-weight: 800; color: #FF6F0F; margin-bottom: 8px; }
  .sub { color: #888; font-size: 15px; margin-bottom: 32px; }
  .btn { display: inline-block; background: #FF6F0F; color: #fff; text-decoration: none;
         font-size: 17px; font-weight: 700; padding: 14px 28px; border-radius: 14px; margin: 6px; }
  .btn.dark { background: #1A1A1A; }
  .hint { color: #aaa; font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<div class="logo">Dari</div>
<div class="sub">Jobs for foreigners in Korea</div>
<div id="buttons">
  <a class="btn" id="open">Open App / 앱 열기</a><br>
  <a class="btn dark" id="store">Download / 다운로드</a>
</div>
<div class="hint" id="hint">Opening the app…</div>

<script>
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6800191536';
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.dariwork.app';
  var PKG = 'com.dariwork.app';
  var SCHEME = 'dari://open'; // 앱에 dari:// 스킴이 배포되면 iOS 즉시열기 자동 활성화

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  var storeUrl = isAndroid ? PLAY_STORE : APP_STORE;
  document.getElementById('store').href = storeUrl;

  function androidIntent() {
    // Chrome: 설치돼 있으면 앱 실행, 없으면 fallback으로 Play 스토어
    return 'intent://open#Intent;scheme=dari;package=' + PKG +
           ';S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE) + ';end';
  }

  function tryOpen() {
    if (isAndroid) {
      window.location.href = androidIntent();
      // 인텐트 미지원 브라우저 대비 폴백
      setTimeout(function () {
        if (!document.hidden) window.location.href = PLAY_STORE;
      }, 1600);
    } else if (isIOS) {
      // iOS는 App Store 직행 — 커스텀 스킴 시도는 미설치 시 사파리
      // "주소가 유효하지 않음" 경고를 띄움. 설치자는 스토어의 '열기' 버튼 사용.
      // (향후 유니버설 링크 도입 시 즉시열기로 업그레이드)
      window.location.href = APP_STORE;
    } else {
      document.getElementById('hint').textContent = '';
    }
  }

  document.getElementById('open').addEventListener('click', function (e) {
    e.preventDefault();
    tryOpen();
  });

  // 진입 즉시 1회 자동 시도 (모바일만)
  if (isAndroid || isIOS) tryOpen();
})();
</script>
</body>
</html>
